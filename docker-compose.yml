# OpsFlow local development stack.
#
#   docker compose up -d                 infrastructure only (the daily loop:
#                                        backend and frontend run from the IDE)
#   docker compose --profile app up -d   the whole application stack (from M9)
#
# The backend and frontend images join this file at M9.

services:
  postgres:
    image: postgres:18-alpine
    container_name: opsflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-opsflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ expects a single mount at /var/lib/postgresql, not at
      # .../data: the image places the cluster in a version-named subdirectory
      # so that pg_upgrade --link works across a major-version bump.
      - postgres-data:/var/lib/postgresql
      # Creates the secondary keycloak database. Runs only on first
      # initialisation of an empty data volume.
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      # Depending services wait on this, not on the container merely starting:
      # Postgres accepts TCP connections before it is ready to serve queries.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsflow} -d ${POSTGRES_DB:-opsflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: opsflow-keycloak
    # start-dev is explicitly a development mode: no TLS, relaxed hostname checks.
    # A deployed instance runs `start` with real certificates and its own database.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-opsflow}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      # The realm is configuration as code: importing it on start means the local
      # stack is reproducible and nobody has to click through the admin console.
      - ./deploy/keycloak/realm-opsflow.json:/opt/keycloak/data/import/realm-opsflow.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
