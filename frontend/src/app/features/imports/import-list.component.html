<app-page-header title="CSV imports" subtitle="Bulk-loaded values and how they went">
  <button matButton="filled" data-action="new-import" (click)="start()">
    <mat-icon>upload_file</mat-icon>
    New import
  </button>
</app-page-header>

@if (facade.imports().length === 0 && !facade.loading()) {
  <app-empty-state icon="upload_file" message="Nothing has been imported yet." />
} @else {
  <table mat-table [dataSource]="facade.imports()" class="table">
    <ng-container matColumnDef="file">
      <th mat-header-cell *matHeaderCellDef>File</th>
      <td mat-cell *matCellDef="let job">
        <strong>{{ job.originalFilename }}</strong>
      </td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let job"><app-status-chip [status]="job.status" /></td>
    </ng-container>
    <ng-container matColumnDef="rows">
      <th mat-header-cell *matHeaderCellDef>Rows</th>
      <td mat-cell *matCellDef="let job">
        {{ job.validRows }} applied · {{ job.invalidRows }} rejected of {{ job.submittedRows }}
      </td>
    </ng-container>
    <ng-container matColumnDef="started">
      <th mat-header-cell *matHeaderCellDef>Started</th>
      <td mat-cell *matCellDef="let job">{{ job.createdAt | date: 'short' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
      <td mat-cell *matCellDef="let job" class="actions-column">
        <a matButton [routerLink]="[job.id]">Open</a>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <mat-paginator
    [length]="facade.total()"
    [pageIndex]="page()"
    [pageSize]="size()"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="changePage($event)"
  />
}
