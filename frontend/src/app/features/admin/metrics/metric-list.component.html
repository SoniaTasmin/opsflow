<app-page-header title="Metrics" subtitle="What organizations report">
  <button matButton="filled" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    New metric
  </button>
</app-page-header>

<div class="filters">
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Search</mat-label>
    <input
      matInput
      [ngModel]="search()"
      (ngModelChange)="search.set($event)"
      (keyup.enter)="applyFilters()"
      placeholder="Code or name"
    />
  </mat-form-field>

  <mat-button-toggle-group
    [ngModel]="activeFilter()"
    (ngModelChange)="activeFilter.set($event); applyFilters()"
  >
    <mat-button-toggle value="all">All</mat-button-toggle>
    <mat-button-toggle value="active">Active</mat-button-toggle>
    <mat-button-toggle value="archived">Archived</mat-button-toggle>
  </mat-button-toggle-group>
</div>

@if (facade.metrics().length === 0 && !facade.loading()) {
  <app-empty-state icon="straighten" message="No metrics match." />
} @else {
  <table mat-table [dataSource]="facade.metrics()" class="table">
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef>Code</th>
      <td mat-cell *matCellDef="let metric">
        <strong>{{ metric.code }}</strong>
      </td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let metric">{{ metric.name }}</td>
    </ng-container>
    <ng-container matColumnDef="unit">
      <th mat-header-cell *matHeaderCellDef>Unit</th>
      <td mat-cell *matCellDef="let metric">{{ metric.unit }}</td>
    </ng-container>
    <ng-container matColumnDef="valueType">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let metric">{{ metric.valueType }}</td>
    </ng-container>
    <ng-container matColumnDef="range">
      <th mat-header-cell *matHeaderCellDef>Range</th>
      <td mat-cell *matCellDef="let metric">{{ rangeOf(metric) }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let metric">
        <app-status-chip [status]="metric.active ? 'ACTIVE' : 'ARCHIVED'" />
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
      <td mat-cell *matCellDef="let metric" class="actions-column">
        <button
          matIconButton
          (click)="openEdit(metric)"
          [disabled]="!metric.active"
          matTooltip="Edit"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          matIconButton
          (click)="archive(metric)"
          [disabled]="!metric.active"
          matTooltip="Archive"
        >
          <mat-icon>archive</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <mat-paginator
    [length]="facade.total()"
    [pageIndex]="page()"
    [pageSize]="size()"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="changePage($event)"
  />
}
