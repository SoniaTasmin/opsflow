name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

# A superseded run on the same ref is wasted compute.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check formatting
        working-directory: backend
        run: ./gradlew spotlessCheck

      - name: Build and test
        working-directory: backend
        run: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # ci, not install: the lockfile is authoritative and a drifting
        # package.json should fail rather than be silently reconciled.
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Test
        working-directory: frontend
        run: npm run test:ci

      - name: Build
        working-directory: frontend
        run: npm run build

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Gitleaks scans history, not just the diff: a secret removed in a
          # later commit is still a leaked secret.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan dependencies and filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  integration:
    name: Contract and browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The same local values the Compose file defaults to. Nothing here is a deployed
      # credential, so this job needs no repository secrets.
      - name: Start PostgreSQL and Keycloak
        run: |
          cp .env.example .env
          docker compose up -d

      - name: Build the backend
        working-directory: backend
        run: ./gradlew bootJar

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      - name: Start the backend
        run: |
          set -a && . ./.env && set +a
          export OPSFLOW_DB_PASSWORD="$POSTGRES_PASSWORD" OPSFLOW_DB_USER="$POSTGRES_USER"
          jar=$(ls backend/build/libs/*.jar | grep -v plain)
          nohup java -jar "$jar" > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/actuator/health >/dev/null && exit 0
            sleep 3
          done
          echo "The backend did not become healthy"; tail -50 backend.log; exit 1

      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 60); do
            curl -fsS localhost:8081/realms/opsflow/.well-known/openid-configuration >/dev/null && exit 0
            sleep 3
          done
          echo "Keycloak did not import the realm in time"; docker compose logs keycloak | tail -50; exit 1

      # Regenerating against the running application is the only check that catches a
      # controller change nobody propagated to the client.
      - name: Verify the generated API client matches the served contract
        working-directory: frontend
        run: |
          bash scripts/generate-api-client.sh
          git diff --exit-code -- openapi src/app/core/api/generated

      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Serve the production build
        working-directory: frontend
        run: |
          nohup node e2e/serve-dist.mjs dist/opsflow-frontend/browser 4200 > serve.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS localhost:4200/ >/dev/null && exit 0; sleep 1; done
          echo "The static server did not start"; cat serve.log; exit 1

      - name: Run the browser suite
        working-directory: frontend
        run: npx playwright test

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics
          path: |
            backend.log
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # Single required status check for branch protection, so adding a job later
  # does not mean reconfiguring the protection rule.
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration, security]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs succeeded."
