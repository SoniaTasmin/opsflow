# Shared defaults. Environment-specific values live in application-<profile>.yml
# and, in deployed environments, in environment variables only.
#
# No secret ever has a default here: a missing one must fail startup rather than
# fall back to a placeholder.
spring:
  application:
    name: opsflow

  datasource:
    url: ${OPSFLOW_DB_URL:jdbc:postgresql://localhost:5432/opsflow}
    username: ${OPSFLOW_DB_USER:opsflow}
    password: ${OPSFLOW_DB_PASSWORD:}
    hikari:
      pool-name: opsflow-pool
      maximum-pool-size: 10

  flyway:
    enabled: true
    schemas: opsflow
    default-schema: opsflow
    # A migration is immutable once merged. Validation catches an edited file,
    # and out-of-order application would let two branches apply in either order.
    validate-on-migrate: true
    out-of-order: false
    # `clean` drops everything in the schema. It is disabled in every profile,
    # including local: pointing it at the wrong URL is how people lose data.
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      # Hibernate never creates or alters a table; Flyway owns the schema.
      # A mismatch between entities and migrations fails startup, which is the
      # single cheapest way to catch schema drift.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: opsflow

  security:
    oauth2:
      resourceserver:
        jwt:
          # Signature keys are fetched from this issuer's JWKS and cached; there is
          # no introspection call per request.
          issuer-uri: ${OPSFLOW_OIDC_ISSUER_URI:http://localhost:8081/realms/opsflow}
          # Set explicitly so signing keys are fetched on first use rather than during
          # startup. Discovery would make a reachable identity provider a precondition
          # for the application booting at all.
          jwk-set-uri: ${OPSFLOW_OIDC_JWK_SET_URI:http://localhost:8081/realms/opsflow/protocol/openid-connect/certs}

  # Structured logs as JSON, using Spring Boot's built-in support. MDC entries —
  # including correlationId — are emitted as fields, so logs are queryable
  # without a log-parsing regex. Overridden to plain text for local development.
  threads:
    virtual:
      # Off until measured: virtual threads can pin on synchronized blocks and
      # interact badly with a fixed JDBC pool. Enabling them is a decision to
      # make with evidence.
      enabled: false

logging:
  structured:
    format:
      console: ecs

server:
  port: 8080
  error:
    # A stack trace or exception message must never cross the wire, in any
    # profile. The problem detail carries a correlation id instead.
    include-stacktrace: never
    include-message: never

opsflow:
  security:
    # A token signed by the right issuer still is not necessarily meant for this API.
    # Requiring this audience is what prevents a token minted for another client from
    # being replayed here.
    audience: ${OPSFLOW_OIDC_AUDIENCE:opsflow-api}
    # Exact origins only. Never a wildcard.
    allowed-origins: ${OPSFLOW_CORS_ALLOWED_ORIGINS:http://localhost:4200}

  workflow:
    # Segregation of duties: the person who submitted a report may not approve it.
    allow-self-approval: ${OPSFLOW_ALLOW_SELF_APPROVAL:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        # health and info only. env, heapdump, threaddump and loggers stay closed.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Liveness must never depend on an external system: if it did, a database
        # blip would restart every pod and turn a short outage into a cascading one.
        liveness:
          include: livenessState
        # Readiness does include the database, because an instance that cannot
        # reach PostgreSQL cannot do useful work.
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false
