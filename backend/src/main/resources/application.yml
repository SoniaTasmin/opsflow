# Shared defaults. Environment-specific values live in application-<profile>.yml
# and, in deployed environments, in environment variables only.
#
# No secret ever has a default here: a missing one must fail startup rather than
# fall back to a placeholder. That is enforced by @Validated @ConfigurationProperties
# as configuration is introduced, not by this file.
spring:
  application:
    name: opsflow

server:
  port: 8080
  error:
    # A stack trace or exception message must never cross the wire, in any
    # profile. From M1 the RFC 9457 problem detail carries a correlation ID instead.
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # health and info only for now; prometheus is added with the metrics
        # work in hardening. env, heapdump, threaddump and loggers stay closed.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Liveness must never depend on an external system: if it did, a
        # database blip would restart every pod and turn a short outage into a
        # cascading one. Readiness gains its database check in M1.
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  info:
    env:
      enabled: false
